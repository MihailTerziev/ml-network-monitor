services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-ml_network_monitor}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ml_network_monitor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-ml_network_monitor}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting Compose}
      MODEL_PATH: ./models/tls_64byte_dropout_autoencoder.keras
      DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-0.18}
      MODEL_DIR: ./models
      ZEEK_HOST: 0.0.0.0
      ZEEK_PORT: 9999
      ZEEK_SHARED_TOKEN: ${ZEEK_SHARED_TOKEN:-}
      ZEEK_INTERFACE: ${ZEEK_INTERFACE:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9999:9999"
    volumes:
      - ./backend:/workspace/backend
      - ./frontend:/workspace/frontend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  zeek-sensor:
    profiles: ["sensor"]
    build:
      context: .
      dockerfile: zeek/Dockerfile
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      backend:
        condition: service_started
    environment:
      ZEEK_INTERFACE: ${ZEEK_INTERFACE:-}
      MLNM_SESSION_ID: ${MLNM_SESSION_ID:-}
      ZEEK_SHARED_TOKEN: ${ZEEK_SHARED_TOKEN:-}
      ZEEK_BRIDGE_HOST: ${ZEEK_BRIDGE_HOST:-127.0.0.1}
      ZEEK_BRIDGE_PORT: ${ZEEK_BRIDGE_PORT:-9999}
    restart: unless-stopped

volumes:
  postgres_data:
